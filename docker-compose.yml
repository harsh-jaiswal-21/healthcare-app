version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: healthcare_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthcare-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./healthcare-backend
    container_name: healthcare_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/healthcare_db
      - SECRET_KEY=super_secure_jwt_secret_key_dev_mode
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - healthcare-net

  frontend:
    build: ./healthcare-frontend
    container_name: healthcare_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - healthcare-net

volumes:
  postgres_data:

networks:
  healthcare-net:
    driver: bridge